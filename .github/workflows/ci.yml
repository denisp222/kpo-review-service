name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Этап для снимка метрик
        type: choice
        default: lab5-baseline
        options:
          [
            lab5-baseline,
            prototype,
            infrastructure,
            implementation-1,
            implementation-2,
            implementation-3,
            testing,
            release,
          ]
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: review_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://review:ci_test_password@localhost:5432/review_test
      TEST_DATABASE_URL: postgresql://review:ci_test_password@localhost:5432/review_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Commit messages
        run: node scripts/check-commits.mjs
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Lint, tests, coverage, build
        if: github.event_name != 'workflow_dispatch'
        run: npm run quality
      - name: Stage metrics
        if: github.event_name == 'workflow_dispatch'
        env:
          STAGE: ${{ inputs.stage }}
        run: npm run snapshot -- --stage "$STAGE"
      - name: Job summary
        if: always()
        run: if [ -f reports/metrics.md ]; then cat reports/metrics.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports-${{ github.run_id }}
          path: |
            reports/
            docs/metrics/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            dist/
            prototype/dist/
            prisma/
            package.json
            package-lock.json
          retention-days: 90
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release version and main history
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: release-build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "$TAG.tar.gz" -C release-build .
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$TAG.tar.gz" release-build/prototype/dist/prototype.html --verify-tag --title "$TAG" --notes-file CHANGELOG.md "${flags[@]}"
